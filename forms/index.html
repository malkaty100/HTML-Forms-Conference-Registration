<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="/submit" method="post">
        <fieldset>
            <legend>text input</legend>
            <label for="name">name</label>
            <input placeholder="your name" id="name" name="name" required type="text">
            <br>
            <label for="password">password</label>
            <input type="password" minlength="2" maxlength="8" id="password" name="password">
            <br>
            <labe for="email">email</labe>
            <input type="email" id="email" name="email">
        </fieldset>
        <fieldset>
            <legend>range & file</legend>
            <label for="file">file</label>
            <input type="file" id="file" name="file" placeholder="choose file">
            <br>
            <label for="age">age</label>
            <input type="number" id="file" name="file">
            <br>
            <label for="range">range</label>
            <input type="range" min="2" max="10" value="9" id="range" name="range">
        </fieldset>
        <fieldset>
            <legend>radio</legend>
            <label for="small">small</label>
            <input type="radio" id="small" name="size">
            <label for="medium">medium</label>
            <input type="radio" id="medium" name="size">
            <label for="large">large</label>
            <input type="radio" id="large" name="size" checked>
        </fieldset>
        <fieldset>
            <legend>checkbox</legend>
            <label for="html">html</label>
            <input type="checkbox" id="html" name="topic">
            <label for="css">css</label>
            <input type="checkbox" id="css" name="topic">
            <label for="javaScript">java script</label>
            <input type="checkbox" id="javaScript" name="topic" checked>
        </fieldset>
        <fieldset>
            <legend>select from list</legend>
            <label for="country">country</label>
            <select id="country" name="country">
                <option value="il">Israel</option>
                <option value="usa">usa</option>
                <option value="ger">Garmany</option>
            </select>
              </fieldset>
        <button type="submit">send</button>
    </form> 
  main>(article>p>img+iframe)*2
main>article*2>p>img>


  
</body>

</html>
